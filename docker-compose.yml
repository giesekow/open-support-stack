      PENPOT_OIDC_EMAIL_ATTR: email
      PENPOT_OIDC_USER_INFO_SOURCE: userinfo
      PENPOT_SSRF_ALLOWED_HOSTS: keycloak ${SSO_HOST:-sso.example.com}
      PENPOT_SMTP_HOST: ${SMTP_HOST}
      PENPOT_SMTP_PORT: ${SMTP_PORT:-587}
      PENPOT_SMTP_USERNAME: ${SMTP_USER:-}
      PENPOT_SMTP_PASSWORD: ${SMTP_PASS:-}
      PENPOT_SMTP_SSL: ${SMTP_SECURE:-false}
      PENPOT_SMTP_TLS: ${SMTP_STARTTLS:-true}
      PENPOT_SMTP_DEFAULT_FROM: ${SMTP_FROM}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${SMTP_FROM}
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
