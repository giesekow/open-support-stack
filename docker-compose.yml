services:
  keycloak-db:
    image: postgres:16
    container_name: support-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - backend

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c}
    container_name: support-keycloak
    restart: unless-stopped
    depends_on:
      - keycloak-db
    command:
      - ${KEYCLOAK_START_CMD:-start-dev}
      - --import-realm
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://${SSO_HOST:-sso.example.com}
      - --hostname-strict=${KEYCLOAK_HOSTNAME_STRICT:-false}
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./config/keycloak/realm-support.json:/opt/keycloak/data/import/realm-support.json:ro
    networks:
      - backend

  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: support-vaultwarden
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$${SMTP_USERNAME:-}" ]; then
        unset SMTP_USERNAME SMTP_PASSWORD SMTP_AUTH_MECHANISM;
        fi &&
        cat /etc/ssl/certs/ca-certificates.crt /custom-certs/support-stack-ca.crt
        > /tmp/support-stack-ca-bundle.crt &&
        export SSL_CERT_FILE=/tmp/support-stack-ca-bundle.crt &&
        exec /start.sh
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:-true}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vaultwarden}
      SMTP_USERNAME: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASS:-}
      # The startup command removes empty SMTP auth variables for no-auth servers.
      SMTP_AUTH_MECHANISM: ${SMTP_AUTH_MECHANISM-}
    volumes:
      - vaultwarden-data:/data
      - ./nginx/certs/support-stack-ca.crt:/custom-certs/support-stack-ca.crt:ro
    extra_hosts:
      # In HTTP-only nginx deployments, send OIDC HTTPS discovery through the
      # TLS-terminating reverse proxy instead of nginx's Docker DNS alias.
      - "${SSO_HOST:-sso.example.com}:${SSO_INTERNAL_PROXY_IP:-host-gateway}"
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: support-mailpit
    restart: unless-stopped
    profiles:
      - development
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

  bookstack-db:
    image: mariadb:11.4
    container_name: support-bookstack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BOOKSTACK_DB_DATABASE}
      MYSQL_USER: ${BOOKSTACK_DB_USER}
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    networks:
      - backend

  bookstack:
    image: ${BOOKSTACK_IMAGE:-lscr.io/linuxserver/bookstack@sha256:c9eee56c8beb181d8e53ea616be1537f2c65f394d7e7fb19c90e7059dc7670d6}
    container_name: support-bookstack
    restart: unless-stopped
    depends_on:
      - bookstack-db
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      APP_URL: ${BOOKSTACK_APP_URL}
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_DATABASE: ${BOOKSTACK_DB_DATABASE}
      DB_USERNAME: ${BOOKSTACK_DB_USER}
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      AUTH_METHOD: ${BOOKSTACK_AUTH_METHOD}
      AUTH_AUTO_INITIATE: ${BOOKSTACK_AUTH_AUTO_INITIATE}
      OIDC_NAME: ${BOOKSTACK_OIDC_NAME}
      OIDC_DISPLAY_NAME_CLAIMS: ${BOOKSTACK_OIDC_DISPLAY_NAME_CLAIMS}
      OIDC_CLIENT_ID: ${BOOKSTACK_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${BOOKSTACK_OIDC_CLIENT_SECRET}
      OIDC_ISSUER: ${BOOKSTACK_OIDC_ISSUER}
      OIDC_ISSUER_DISCOVER: ${BOOKSTACK_OIDC_ISSUER_DISCOVER}
      OIDC_AUTH_ENDPOINT: ${BOOKSTACK_OIDC_AUTH_ENDPOINT}
      OIDC_TOKEN_ENDPOINT: ${BOOKSTACK_OIDC_TOKEN_ENDPOINT}
      OIDC_USERINFO_ENDPOINT: ${BOOKSTACK_OIDC_USERINFO_ENDPOINT}
      OIDC_PUBLIC_KEY: ${BOOKSTACK_OIDC_PUBLIC_KEY}
      OIDC_END_SESSION_ENDPOINT: ${BOOKSTACK_OIDC_END_SESSION_ENDPOINT}
      BOOKSTACK_DEFAULT_REGISTRATION_ROLE: ${BOOKSTACK_DEFAULT_REGISTRATION_ROLE:-Viewer}
      SESSION_DRIVER: ${BOOKSTACK_SESSION_DRIVER:-database}
    volumes:
      - bookstack-data:/config
      - ./nginx/certs:/custom-certs:ro
      - ./config/bookstack/custom-cont-init.d:/custom-cont-init.d:ro
    extra_hosts:
      - "${SSO_HOST:-sso.example.com}:${BOOKSTACK_OIDC_HOST_IP:-host-gateway}"
    networks:
      - backend

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: support-guacd
    restart: unless-stopped
    networks:
      - backend

  guacamole-db:
    image: postgres:16
    container_name: support-guacamole-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GUACAMOLE_DB_NAME}
      POSTGRES_USER: ${GUACAMOLE_DB_USER}
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - guacamole-db-data:/var/lib/postgresql/data
    networks:
      - backend

  guacamole-db-init:
    image: postgres:16
    container_name: support-guacamole-db-init
    depends_on:
      - guacamole-db
    command: >
      /bin/sh -c "
      until pg_isready -h guacamole-db -p 5432 -U ${GUACAMOLE_DB_USER}; do sleep 2; done &&
      PGPASSWORD=${GUACAMOLE_DB_PASSWORD} psql -h guacamole-db -U ${GUACAMOLE_DB_USER} -d ${GUACAMOLE_DB_NAME} -f /initdb.sql
      "
    volumes:
      - ./config/guacamole/initdb.sql:/initdb.sql:ro
    restart: "no"
    networks:
      - backend

  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: support-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - guacamole-db
      - guacamole-db-init
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${GUACAMOLE_DB_NAME}
      POSTGRESQL_USER: ${GUACAMOLE_DB_USER}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      EXTENSION_PRIORITY: "openid,postgresql"
      OPENID_ISSUER: ${GUACAMOLE_OPENID_ISSUER}
      OPENID_CLIENT_ID: ${GUACAMOLE_OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${GUACAMOLE_OPENID_CLIENT_SECRET}
      OPENID_REDIRECT_URI: ${GUACAMOLE_OPENID_REDIRECT_URI}
      OPENID_AUTHORIZATION_ENDPOINT: ${GUACAMOLE_OPENID_AUTHORIZATION_ENDPOINT}
      OPENID_JWKS_ENDPOINT: ${GUACAMOLE_OPENID_JWKS_ENDPOINT}
      OPENID_TOKEN_ENDPOINT: ${GUACAMOLE_OPENID_TOKEN_ENDPOINT}
      OPENID_LOGOUT_ENDPOINT: ${GUACAMOLE_OPENID_LOGOUT_ENDPOINT}
      OPENID_USERNAME_CLAIM_TYPE: preferred_username
      OPENID_SCOPE: "openid profile email"
    networks:
      - backend

  netbird-server:
    image: ${NETBIRD_SERVER_IMAGE:-netbirdio/netbird-server@sha256:d1da0c0179c9e6f2ab7b48be54d06341b11037855a9426b9f2536aa79f13360b}
    container_name: support-netbird-server
    restart: unless-stopped
    entrypoint: ["/usr/bin/sh", "-c"]
    command:
      - >-
        cat /etc/ssl/certs/ca-certificates.crt /etc/netbird/support-stack-ca.crt
        > /tmp/netbird-ca-bundle.crt &&
        exec /go/bin/netbird-server --config /etc/netbird/config.yaml
    environment:
      SSL_CERT_FILE: /tmp/netbird-ca-bundle.crt
    volumes:
      - netbird-data:/var/lib/netbird
      - ./config/netbird/config.yaml:/etc/netbird/config.yaml:ro
      - ./nginx/certs/support-stack-ca.crt:/etc/netbird/support-stack-ca.crt:ro
    ports:
      - "${NETBIRD_STUN_PORT:-3478}:3478/udp"
    extra_hosts:
      # Keep the public HTTPS issuer while avoiding nginx's HTTP-only alias.
      - "${SSO_HOST:-sso.example.com}:${NETBIRD_SSO_HOST_IP:-host-gateway}"
    networks:
      - backend

  netbird-dashboard:
    image: ${NETBIRD_DASHBOARD_IMAGE:-netbirdio/dashboard@sha256:fa2d8b02a81761e4d2a22df4041d13316b7635f1e93273eafeb53d4991e55b5a}
    container_name: support-netbird-dashboard
    restart: unless-stopped
    depends_on:
      - netbird-server
    env_file:
      - ./config/netbird/dashboard.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null && curl -fsS http://netbird-server/api/instance >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  osticket-db:
    image: mariadb:11.4
    container_name: support-osticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OSTICKET_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OSTICKET_DB_NAME}
      MYSQL_USER: ${OSTICKET_DB_USER}
      MYSQL_PASSWORD: ${OSTICKET_DB_PASSWORD}
    volumes:
      - osticket-db-data:/var/lib/mysql
    networks:
      - backend

  espocrm-db:
    image: mariadb:11.4
    container_name: support-espocrm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${ESPOCRM_DB_NAME}
      MARIADB_USER: ${ESPOCRM_DB_USER}
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - espocrm-db-data:/var/lib/mysql
    networks:
      - backend

  espocrm:
    image: ${ESPOCRM_IMAGE:-espocrm/espocrm@sha256:8b38e9ec6a7caaee6744ad247a44a0f4f23729c2efe379e68f1203439d3ff319}
    container_name: support-espocrm
    restart: unless-stopped
    depends_on:
      - espocrm-db
    environment:
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_PORT: 3306
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_LANGUAGE: ${ESPOCRM_LANGUAGE}
      ESPOCRM_CONFIG_AUTHENTICATION_METHOD: Oidc
      ESPOCRM_CONFIG_OIDC_CLIENT_ID: ${ESPOCRM_OIDC_CLIENT_ID}
      ESPOCRM_CONFIG_OIDC_CLIENT_SECRET: ${ESPOCRM_OIDC_CLIENT_SECRET}
      ESPOCRM_CONFIG_OIDC_AUTHORIZATION_ENDPOINT: https://${SSO_HOST}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      ESPOCRM_CONFIG_OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      ESPOCRM_CONFIG_OIDC_USER_INFO_ENDPOINT: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      ESPOCRM_CONFIG_OIDC_JWKS_ENDPOINT: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      ESPOCRM_CONFIG_OIDC_USERNAME_CLAIM: sub
      ESPOCRM_CONFIG_OIDC_CREATE_USER: "true"
      ESPOCRM_CONFIG_OIDC_SYNC: "true"
      ESPOCRM_CONFIG_OIDC_SYNC_TEAMS: "false"
      ESPOCRM_CONFIG_OIDC_AUTHORIZATION_PROMPT: login
      ESPOCRM_CONFIG_OIDC_FALLBACK: "true"
      ESPOCRM_CONFIG_OIDC_ALLOW_REGULAR_USER_FALLBACK: "false"
      ESPOCRM_CONFIG_OIDC_ALLOW_ADMIN_USER: "false"
    volumes:
      - espocrm-data:/var/www/html
    networks:
      - backend

  support-tools-db:
    image: postgres:17-alpine
    container_name: support-support-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPPORT_TOOLS_DB_NAME}
      POSTGRES_USER: ${SUPPORT_TOOLS_DB_USER}
      POSTGRES_PASSWORD: ${SUPPORT_TOOLS_DB_PASSWORD}
    volumes:
      - support-tools-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPPORT_TOOLS_DB_USER} -d ${SUPPORT_TOOLS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend

  support-tools:
    build:
      context: ./services/support-tools
    container_name: support-support-tools
    restart: unless-stopped
    depends_on:
      support-tools-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql+psycopg://${SUPPORT_TOOLS_DB_USER}:${SUPPORT_TOOLS_DB_PASSWORD}@support-tools-db:5432/${SUPPORT_TOOLS_DB_NAME}
      SUPPORT_TOOLS_SESSION_SECRET: ${SUPPORT_TOOLS_SESSION_SECRET}
      SUPPORT_TOOLS_COOKIE_SECURE: ${SUPPORT_TOOLS_COOKIE_SECURE:-true}
      SUPPORT_TOOLS_ALLOWED_GROUP: ${SUPPORT_TOOLS_ALLOWED_GROUP:-support-admin}
      SUPPORT_TOOLS_DEV_AUTH_BYPASS: ${SUPPORT_TOOLS_DEV_AUTH_BYPASS:-false}
      SUPPORT_TOOLS_DEV_USER_EMAIL: ${SUPPORT_TOOLS_DEV_USER_EMAIL:-developer@example.com}
      SUPPORT_TOOLS_DEV_USER_NAME: ${SUPPORT_TOOLS_DEV_USER_NAME:-Local developer}
      SUPPORT_TOOLS_RUNTIME_DIR: /runtime
      SUPPORT_TOOLS_SEED_DIR: /seed
      PROVISIONING_ENABLED: ${PROVISIONING_ENABLED:-false}
      PROVISIONING_ALLOW_WRITES: ${PROVISIONING_ALLOW_WRITES:-false}
      PROVISIONING_INTERVAL_SECONDS: ${PROVISIONING_INTERVAL_SECONDS:-300}
      PROVISIONING_HTTP_TIMEOUT_SECONDS: ${PROVISIONING_HTTP_TIMEOUT_SECONDS:-20}
      PROVISIONING_JIT_REVIEW_AFTER_DAYS: ${PROVISIONING_JIT_REVIEW_AFTER_DAYS:-7}
      PROVISIONING_AUDIT_RETENTION_DAYS: ${PROVISIONING_AUDIT_RETENTION_DAYS:-730}
      PROVISIONING_OPERATIONAL_LOG_RETENTION_DAYS: ${PROVISIONING_OPERATIONAL_LOG_RETENTION_DAYS:-90}
      PROVISIONING_CLOSED_REVIEW_RETENTION_DAYS: ${PROVISIONING_CLOSED_REVIEW_RETENTION_DAYS:-730}
      PROVISIONING_KEYCLOAK_URL: http://keycloak:8080
      PROVISIONING_KEYCLOAK_ISSUER: https://${SSO_HOST:-sso.example.com}/realms/${KEYCLOAK_REALM:-support}
      PROVISIONING_KEYCLOAK_CLIENT_ID: ${PROVISIONING_KEYCLOAK_CLIENT_ID:-support-tools-provisioning}
      PROVISIONING_KEYCLOAK_CLIENT_SECRET: ${PROVISIONING_KEYCLOAK_CLIENT_SECRET}
      PROVISIONING_BOOKSTACK_DB_HOST: bookstack-db
      PROVISIONING_BOOKSTACK_DB_PORT: 3306
      PROVISIONING_BOOKSTACK_DB_NAME: ${BOOKSTACK_DB_DATABASE}
      PROVISIONING_BOOKSTACK_DB_USER: ${BOOKSTACK_DB_USER}
      PROVISIONING_BOOKSTACK_DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      PROVISIONING_BOOKSTACK_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_BOOKSTACK_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_BOOKSTACK_PROTECTED_USERNAMES: ${PROVISIONING_BOOKSTACK_PROTECTED_USERNAMES:-}
      PROVISIONING_BOOKSTACK_PROTECTED_EMAILS: ${PROVISIONING_BOOKSTACK_PROTECTED_EMAILS:-}
      PROVISIONING_ESPOCRM_DB_HOST: espocrm-db
      PROVISIONING_ESPOCRM_DB_PORT: 3306
      PROVISIONING_ESPOCRM_DB_NAME: ${ESPOCRM_DB_NAME}
      PROVISIONING_ESPOCRM_DB_USER: ${ESPOCRM_DB_USER}
      PROVISIONING_ESPOCRM_DB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      PROVISIONING_ESPOCRM_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_ESPOCRM_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_ESPOCRM_PROTECTED_USERNAMES: ${PROVISIONING_ESPOCRM_PROTECTED_USERNAMES:-${ESPOCRM_ADMIN_USERNAME},system}
      PROVISIONING_ESPOCRM_PROTECTED_EMAILS: ${PROVISIONING_ESPOCRM_PROTECTED_EMAILS:-}
      PROVISIONING_ERPNEXT_DB_HOST: erpnext-db
      PROVISIONING_ERPNEXT_DB_PORT: 3306
      PROVISIONING_ERPNEXT_REDIS_HOST: erpnext-redis-cache
      PROVISIONING_ERPNEXT_REDIS_PORT: 6379
      PROVISIONING_ERPNEXT_SITE_NAME: ${ERPNEXT_SITE_NAME:-erp.example.com}
      PROVISIONING_ERPNEXT_SITES_DIR: /erpnext-sites
      PROVISIONING_ERPNEXT_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_ERPNEXT_PROTECTED_ACCOUNT_IDS:-Administrator,Guest}
      PROVISIONING_ERPNEXT_PROTECTED_USERNAMES: ${PROVISIONING_ERPNEXT_PROTECTED_USERNAMES:-Administrator,Guest}
      PROVISIONING_ERPNEXT_PROTECTED_EMAILS: ${PROVISIONING_ERPNEXT_PROTECTED_EMAILS:-}
      PROVISIONING_SEAFILE_CONFIG_FILE: /seafile-shared/seafile/conf/seahub_settings.py
      PROVISIONING_SEAFILE_CCNET_DB_NAME: ccnet_db
      PROVISIONING_SEAFILE_SEAHUB_DB_NAME: seahub_db
      PROVISIONING_SEAFILE_OAUTH_PROVIDER: keycloak
      PROVISIONING_SEAFILE_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_SEAFILE_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_SEAFILE_PROTECTED_USERNAMES: ${PROVISIONING_SEAFILE_PROTECTED_USERNAMES:-}
      PROVISIONING_SEAFILE_PROTECTED_EMAILS: ${PROVISIONING_SEAFILE_PROTECTED_EMAILS:-${SEAFILE_ADMIN_EMAIL}}
      PROVISIONING_PENPOT_DATABASE_URL: postgresql://${PENPOT_DB_USER}:${PENPOT_DB_PASSWORD}@penpot-db:5432/${PENPOT_DB_NAME}
      PROVISIONING_PENPOT_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_PENPOT_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_PENPOT_PROTECTED_USERNAMES: ${PROVISIONING_PENPOT_PROTECTED_USERNAMES:-}
      PROVISIONING_PENPOT_PROTECTED_EMAILS: ${PROVISIONING_PENPOT_PROTECTED_EMAILS:-}
      PROVISIONING_NETBIRD_API_URL: http://netbird-server
      PROVISIONING_NETBIRD_API_TOKEN: ${PROVISIONING_NETBIRD_API_TOKEN:-}
      PROVISIONING_NETBIRD_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_NETBIRD_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_NETBIRD_PROTECTED_USERNAMES: ${PROVISIONING_NETBIRD_PROTECTED_USERNAMES:-}
      PROVISIONING_NETBIRD_PROTECTED_EMAILS: ${PROVISIONING_NETBIRD_PROTECTED_EMAILS:-${NETBIRD_ADMIN_EMAIL}}
      PROVISIONING_VAULTWARDEN_API_URL: http://vaultwarden
      PROVISIONING_VAULTWARDEN_CLIENT_ID: ${PROVISIONING_VAULTWARDEN_CLIENT_ID:-}
      PROVISIONING_VAULTWARDEN_CLIENT_SECRET: ${PROVISIONING_VAULTWARDEN_CLIENT_SECRET:-}
      PROVISIONING_VAULTWARDEN_ORGANIZATION_ID: ${PROVISIONING_VAULTWARDEN_ORGANIZATION_ID:-}
      PROVISIONING_VAULTWARDEN_DEVICE_IDENTIFIER: ${PROVISIONING_VAULTWARDEN_DEVICE_IDENTIFIER:-}
      PROVISIONING_VAULTWARDEN_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_VAULTWARDEN_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_VAULTWARDEN_PROTECTED_USERNAMES: ${PROVISIONING_VAULTWARDEN_PROTECTED_USERNAMES:-}
      PROVISIONING_VAULTWARDEN_PROTECTED_EMAILS: ${PROVISIONING_VAULTWARDEN_PROTECTED_EMAILS:-}
      PROVISIONING_OSTICKET_DB_HOST: osticket-db
      PROVISIONING_OSTICKET_DB_PORT: 3306
      PROVISIONING_OSTICKET_DB_NAME: ${OSTICKET_DB_NAME}
      PROVISIONING_OSTICKET_DB_USER: ${OSTICKET_DB_USER}
      PROVISIONING_OSTICKET_DB_PASSWORD: ${OSTICKET_DB_PASSWORD}
      PROVISIONING_OSTICKET_SCHEMA_SIGNATURE: ${PROVISIONING_OSTICKET_SCHEMA_SIGNATURE:-83a22ba22b1a6a624fcb1da03882ac1b}
      PROVISIONING_OSTICKET_DEPARTMENT_NAME: ${PROVISIONING_OSTICKET_DEPARTMENT_NAME:-Support}
      PROVISIONING_OSTICKET_ROLE_NAME: ${PROVISIONING_OSTICKET_ROLE_NAME:-Support Agent}
      PROVISIONING_OSTICKET_AUTH_BACKEND: ${PROVISIONING_OSTICKET_AUTH_BACKEND:-}
      PROVISIONING_OSTICKET_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_OSTICKET_PROTECTED_ACCOUNT_IDS:-1}
      PROVISIONING_OSTICKET_PROTECTED_USERNAMES: ${PROVISIONING_OSTICKET_PROTECTED_USERNAMES:-${OSTICKET_ADMIN_USERNAME}}
      PROVISIONING_OSTICKET_PROTECTED_EMAILS: ${PROVISIONING_OSTICKET_PROTECTED_EMAILS:-${OSTICKET_ADMIN_EMAIL}}
      PROVISIONING_GUACAMOLE_DATABASE_URL: postgresql://${GUACAMOLE_DB_USER}:${GUACAMOLE_DB_PASSWORD}@guacamole-db:5432/${GUACAMOLE_DB_NAME}
      PROVISIONING_GUACAMOLE_PROTECTED_ACCOUNT_IDS: ${PROVISIONING_GUACAMOLE_PROTECTED_ACCOUNT_IDS:-}
      PROVISIONING_GUACAMOLE_PROTECTED_USERNAMES: ${PROVISIONING_GUACAMOLE_PROTECTED_USERNAMES:-guacadmin}
      PROVISIONING_GUACAMOLE_PROTECTED_EMAILS: ${PROVISIONING_GUACAMOLE_PROTECTED_EMAILS:-}
      FRAPPE_HR_LEAVE_NOTIFIER_RECIPIENT: ${FRAPPE_HR_LEAVE_NOTIFIER_RECIPIENT:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - ./config/frappe-hr/leave-notifications.json:/seed/leave-notifications.json:ro
      - ./config/frappe-hr/email-templates:/seed/templates:ro
      - support-tools-runtime:/runtime
      - erpnext-sites:/erpnext-sites:ro
      - seafile-data:/seafile-shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend

  frappe-hr-leave-notifier:
    build:
      context: ./services/frappe-hr-leave-notifier
    container_name: support-frappe-hr-leave-notifier
    restart: unless-stopped
    depends_on:
      erpnext-db:
        condition: service_started
      support-tools:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      FRAPPE_HR_DB_HOST: erpnext-db
      FRAPPE_HR_DB_PORT: 3306
      FRAPPE_HR_DB_USER: ${FRAPPE_HR_NOTIFIER_DB_USER:-frappe_hr_notifier}
      FRAPPE_HR_DB_PASSWORD: ${FRAPPE_HR_NOTIFIER_DB_PASSWORD}
      FRAPPE_HR_LEAVE_NOTIFIER_RECIPIENT: ${FRAPPE_HR_LEAVE_NOTIFIER_RECIPIENT:-}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_HOST: ${SMTP_HOST}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_PORT: ${SMTP_PORT:-587}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_FROM: ${SMTP_FROM}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_USERNAME: ${SMTP_USER:-}
      FRAPPE_HR_LEAVE_NOTIFIER_SMTP_PASSWORD: ${SMTP_PASS:-}
      FRAPPE_HR_LEAVE_NOTIFIER_INTERVAL_SECONDS: ${FRAPPE_HR_LEAVE_NOTIFIER_INTERVAL_SECONDS:-60}
      FRAPPE_HR_LEAVE_NOTIFIER_CONFIG: /runtime/leave-notifications.json
      FRAPPE_HR_LEAVE_NOTIFIER_TEMPLATE_DIR: /runtime/templates
    volumes:
      - support-tools-runtime:/runtime:ro
      # Reuse the existing delivery ledger so replacement does not resend summaries.
      - orangehrm-leave-notifier-data:/data
    networks:
      - backend

  erpnext-db:
    image: mariadb:11.4
    container_name: support-erpnext-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - erpnext-db-data:/var/lib/mysql
    networks:
      - backend

  erpnext-redis-cache:
    image: redis:7-alpine
    container_name: support-erpnext-redis-cache
    restart: unless-stopped
    networks:
      - backend

  erpnext-redis-queue:
    image: redis:7-alpine
    container_name: support-erpnext-redis-queue
    restart: unless-stopped
    networks:
      - backend

  erpnext-configurator:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-configurator
    restart: on-failure
    profiles: ["bootstrap"]
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host erpnext-db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://erpnext-redis-cache:6379"
        bench set-config -g redis_queue "redis://erpnext-redis-queue:6379"
        bench set-config -g redis_socketio "redis://erpnext-redis-queue:6379"
        bench set-config -gp socketio_port 9000
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-create-site:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-create-site
    restart: "no"
    profiles: ["bootstrap"]
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
      - erpnext-configurator
    environment:
      ERPNEXT_DB_NAME: ${ERPNEXT_DB_NAME:-erpnext}
      ERPNEXT_DB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
      ERPNEXT_SITE_CONFIG: /home/frappe/frappe-bench/sites/${ERPNEXT_SITE_NAME:-erp.example.com}/site_config.json
      FRAPPE_HR_DB_HOST: erpnext-db
      FRAPPE_HR_DB_PORT: 3306
      FRAPPE_HR_NOTIFIER_DB_USER: ${FRAPPE_HR_NOTIFIER_DB_USER:-frappe_hr_notifier}
      FRAPPE_HR_NOTIFIER_DB_PASSWORD: ${FRAPPE_HR_NOTIFIER_DB_PASSWORD}
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        wait-for-it erpnext-db:3306 -t 120
        wait-for-it erpnext-redis-cache:6379 -t 120
        wait-for-it erpnext-redis-queue:6379 -t 120
        if [ ! -d "sites/${ERPNEXT_SITE_NAME:-erp.example.com}" ]; then
          bench new-site "${ERPNEXT_SITE_NAME:-erp.example.com}" --no-mariadb-socket --mariadb-root-password "${ERPNEXT_DB_ROOT_PASSWORD}" --db-name "${ERPNEXT_DB_NAME:-erpnext}" --db-password "${ERPNEXT_DB_PASSWORD}" --admin-password "${ERPNEXT_ADMIN_PASSWORD}"
        fi
        if ! bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" list-apps | grep -q '^erpnext '; then
          bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" install-app erpnext
        fi
        # Existing sites must receive ERPNext schema moves before HRMS fixtures
        # reference DocTypes that were relocated from ERPNext into HRMS.
        bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" migrate
        if ! bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" list-apps | grep -q '^hrms '; then
          bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" install-app hrms
        fi
        bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" migrate
        for field in \
          expense_approver_mandatory_in_expense_claim \
          leave_approver_mandatory_in_leave_application \
          prevent_self_leave_approval \
          prevent_self_expense_approval \
          send_leave_notification; do
          bench --site "${ERPNEXT_SITE_NAME:-erp.example.com}" execute \
            frappe.db.set_single_value --args "[\"HR Settings\", \"$$field\", 1]"
        done
        /home/frappe/frappe-bench/env/bin/python /opt/support-stack/frappe_hr_db_user.py
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - ./scripts/frappe_hr_db_user.py:/opt/support-stack/frappe_hr_db_user.py:ro
    networks:
      - backend

  erpnext-backend:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-backend
    restart: unless-stopped
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    command: /home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites -b 0.0.0.0:8000 -w 2 --threads 4 --timeout 120 frappe.app:application
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-websocket:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-websocket
    restart: unless-stopped
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-queue-short:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-queue-short
    restart: unless-stopped
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    command: bench worker --queue short,default
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-queue-long:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-queue-long
    restart: unless-stopped
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    command: bench worker --queue long,default,short
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-scheduler:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-scheduler
    restart: unless-stopped
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    command: bench schedule
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  erpnext-frontend:
    image: ${FRAPPE_HRMS_IMAGE:-ghcr.io/frappe/hrms:v15.64.3@sha256:437cf73e2da0f3e80b400f9fc3ca7fa21e93a7a0620474545140a8698d83812c}
    container_name: support-erpnext-frontend
    restart: unless-stopped
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-erp.example.com}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 100m
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    networks:
      - backend

  seafile-db:
    image: mariadb:11.4
    container_name: support-seafile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SEAFILE_DB_NAME}
      MYSQL_USER: ${SEAFILE_DB_USER}
      MYSQL_PASSWORD: ${SEAFILE_DB_PASSWORD}
